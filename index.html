<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e0f12">
<title>Gym Log</title>
<style>
:root{
  --bg:#0e0f12; --card:#181a1f; --line:#2a2d35; --text:#ecedf0; --muted:#9097a3;
  --accent:#4fb3a9; --accent-ink:#06201d; --up:#7cc96b; --warn:#e0a84f; --down:#e07a6f;
  --radius:14px;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f4f4f1; --card:#ffffff; --line:#e1e1dc; --text:#1b1c1f; --muted:#666b74;
         --accent:#1f7f76; --accent-ink:#ffffff; --up:#2f8a3a; --warn:#a96d10; --down:#b2443a; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 10px;
  border-bottom:1px solid var(--line);margin:0 -16px 14px;padding-left:16px;padding-right:16px}
h1{font-size:20px;margin:0 0 8px}
h2{font-size:17px;margin:20px 0 8px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;white-space:nowrap;padding:9px 4px}
button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:9px 10px;cursor:pointer;touch-action:manipulation}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;width:100%;padding:14px}
button.ghost{background:transparent}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card.done{opacity:.6}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.ex-name{font-weight:650;font-size:17px}
.tag{display:inline-block;font-size:12px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-right:4px}
.tag.posture{border-color:var(--accent);color:var(--accent)}
.goal{margin:8px 0 10px;font-size:14px}
.goal b{font-size:15px}
.up{color:var(--up)} .warn{color:var(--warn)} .down{color:var(--down)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;padding:0;font-size:20px}
.stepper input{width:76px;text-align:center}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px}
.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.set{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:8px 4px}
.set.logged{border-color:var(--accent)}
.set .lbl{font-size:12px;color:var(--muted)}
.set .reps{display:flex;align-items:center;gap:4px}
.set .reps button{width:32px;height:32px;padding:0}
.set .reps span{min-width:26px;text-align:center;font-weight:650;font-size:18px}
.set .tick{width:100%;padding:5px;font-size:13px}
.cue{font-size:13px;color:var(--muted);margin-top:8px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:8px}
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;z-index:6}
.timer .t{font-variant-numeric:tabular-nums;font-size:22px;font-weight:650;min-width:64px}
.timer button{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500}
.hidden{display:none}
.settings-grid{display:grid;grid-template-columns:1fr 80px 64px;gap:6px;align-items:center;font-size:14px}
.settings-grid input{width:100%;padding:6px}
ul.tips{padding-left:18px;margin:6px 0} ul.tips li{margin:4px 0}
</style>
</head>
<body>
<header>
  <div class="row between"><h1>Gym Log</h1><span id="nextHint" class="small muted"></span></div>
  <div class="tabs">
    <button data-view="A">A · Mon</button>
    <button data-view="B">B · Thu</button>
    <button data-view="history">History</button>
    <button data-view="settings">Setup</button>
  </div>
</header>

<main id="view"></main>

<div class="timer">
  <span class="small muted">Rest</span><span class="t" id="tDisp">0:00</span>
  <button data-rest="60">60s</button><button data-rest="90">90s</button><button data-rest="120">2m</button>
  <button id="tStop" class="ghost">✕</button>
</div>

<script>
/* ---------- Program definition ---------- */
// start = last known weight from the old log (null = new machine, enter on first visit).
const EXERCISES = {
  legpress:  {name:"Seated Leg Press",       min:8,  max:12, inc:10, start:130, tags:["quads","glutes"],
              cue:"Feet shoulder-width, low back flat on the pad. Do not lock knees at the top."},
  row:       {name:"Seated Row",             min:8,  max:12, inc:5,  start:115, tags:["upper back","lats"], posture:true,
              cue:"Chest tall, pull elbows back, squeeze shoulder blades together and down for 1 second."},
  chest:     {name:"Chest Press",            min:8,  max:12, inc:5,  start:100, tags:["chest","triceps"],
              cue:"Shoulder blades pinned back against the pad. Do not let shoulders roll forward."},
  pulldown:  {name:"Lat Pulldown",           min:8,  max:12, inc:5,  start:85,  tags:["lats","biceps"], posture:true,
              cue:"Pull bar to upper chest, lead with elbows, chest up. No leaning far back."},
  reardelt:  {name:"Rear Delt (Pec Fly machine, reversed)", min:12, max:15, inc:5, start:null, tags:["rear delts","mid traps"], posture:true,
              cue:"Face the pad, arms straight-ish, sweep back until in line with shoulders. Light weight, slow."},
  legcurl:   {name:"Leg Curl (seated or lying)", min:8, max:12, inc:5, start:85, tags:["hamstrings"],
              cue:"Hips stay down. Control the return — 2–3 seconds."},
  crunch:    {name:"Abdominal Crunch",       min:12, max:15, inc:5,  start:55,  tags:["abs"], posture:true,
              cue:"Curl ribs toward hips; do not pull with the arms."},
  biceps:    {name:"Biceps Curl",            min:10, max:12, inc:5,  start:25,  tags:["biceps"],
              cue:"Elbows fixed on the pad. Full stretch at the bottom."},
  glute:     {name:"Glute Machine",          min:10, max:15, inc:5,  start:null, tags:["glutes"], posture:true,
              cue:"Squeeze the glute at the top; do not arch the low back to get extra range."},
  shoulder:  {name:"Shoulder Press",         min:8,  max:12, inc:5,  start:25,  tags:["shoulders","triceps"],
              cue:"Ribs down, back on the pad. Stop just short of lockout."},
  legext:    {name:"Leg Extension",          min:8,  max:12, inc:5,  start:null, tags:["quads"],
              cue:"Pause 1 second at the top. Lower slowly."},
  abductor:  {name:"Hip Abductor",           min:12, max:15, inc:5,  start:null, tags:["glute med"], posture:true,
              cue:"Lean slightly forward, push knees out, control the return."},
  triceps:   {name:"Seated Triceps Extension", min:10, max:12, inc:5, start:null, tags:["triceps"],
              cue:"Elbows still; only the forearms move."},
};
const PROGRAM = {
  A: {title:"Workout A", day:"Monday",   list:["legpress","row","chest","reardelt","legcurl","crunch","biceps"]},
  B: {title:"Workout B", day:"Thursday", list:["glute","pulldown","shoulder","row","reardelt","legext","abductor","triceps"]},
};
const SETS = 3;

/* ---------- Storage ---------- */
const KEY = "gymlog.v1";
function load(){
  try { return Object.assign({history:[], draft:null, cfg:{}}, JSON.parse(localStorage.getItem(KEY)||"{}")); }
  catch(e){ return {history:[], draft:null, cfg:{}}; }
}
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function cfg(id){ return Object.assign({}, EXERCISES[id], S.cfg[id]||{}); }

/* ---------- Progression (double progression) ----------
   Work inside the rep range. When every set hits the top of the range,
   add one weight increment and drop back to the bottom of the range.
   Missing the bottom of the range two sessions in a row at the same weight → drop ~10%. */
function entriesFor(id){
  const out=[];
  for (let i=S.history.length-1;i>=0;i--){
    const e=S.history[i].entries.find(x=>x.id===id && x.reps.length);
    if (e) out.push(Object.assign({date:S.history[i].date}, e));
  }
  return out; // newest first
}
function roundTo(w, inc){ return Math.max(0, Math.round(w/inc)*inc); }
function target(id){
  const c=cfg(id), past=entriesFor(id), last=past[0];
  if (!last) return {weight:c.start, reps:c.min, note: c.start==null ? "New machine — pick a weight you can do "+c.min+"× with 2 reps to spare." : "Starting point from your old log.", kind:"new"};
  const reps=last.reps, lo=Math.min(...reps);
  if (reps.length>=SETS && reps.every(r=>r>=c.max))
    return {weight:last.weight+c.inc, reps:c.min, note:"Hit "+c.max+" on every set last time → weight up.", kind:"up"};
  if (lo>=c.min)
    return {weight:last.weight, reps:Math.min(c.max, lo+1), note:"Same weight. Beat last time: aim for "+Math.min(c.max, lo+1)+"+ on every set.", kind:"same"};
  const prev=past[1];
  if (prev && prev.weight===last.weight && Math.min(...prev.reps)<c.min)
    return {weight:roundTo(last.weight*0.9, c.inc), reps:c.min, note:"Below "+c.min+" reps twice → lighter, rebuild.", kind:"down"};
  return {weight:last.weight, reps:c.min, note:"Same weight. Aim for "+c.min+" on every set.", kind:"warn"};
}
function lastText(id){
  const l=entriesFor(id)[0];
  return l ? `Last (${fmtDate(l.date)}): ${l.weight} lb × ${l.reps.join(", ")}` : "No history yet";
}
function fmtDate(d){ return new Date(d).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function nextWorkout(){ const l=S.history[S.history.length-1]; return l ? (l.workout==="A"?"B":"A") : "A"; }

/* ---------- Draft (in-progress workout survives reloads) ---------- */
function ensureDraft(w){
  if (S.draft && S.draft.workout===w) return S.draft;
  if (S.draft && S.draft.entries.some(e=>e.logged.some(Boolean)) &&
      !confirm("A Workout "+S.draft.workout+" is in progress. Discard it and start Workout "+w+"?")) return null;
  S.draft={workout:w, started:Date.now(), entries:PROGRAM[w].list.map(id=>{
    const t=target(id);
    return {id, weight:t.weight, reps:Array(SETS).fill(t.reps), logged:Array(SETS).fill(false)};
  })};
  save(); return S.draft;
}

/* ---------- Views ---------- */
const V=document.getElementById("view");
let current = null;

function show(v){
  if ((v==="A"||v==="B") && !ensureDraft(v)) v=S.draft.workout;
  current=v;
  document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("on", b.dataset.view===v));
  document.getElementById("nextHint").textContent = "Next up: "+nextWorkout();
  if (v==="A"||v==="B") renderWorkout(v);
  else if (v==="history") renderHistory();
  else renderSettings();
  window.scrollTo(0,0);
}

function renderWorkout(w){
  const d=S.draft, P=PROGRAM[w];
  let h=`<p class="muted small" style="margin-top:0">${P.title} · usually ${P.day}. Tap ✓ after each set. Weight in lb.</p>`;
  d.entries.forEach((e,i)=>{
    const c=cfg(e.id), t=target(e.id);
    const dup = P.list.indexOf(e.id)!==i ? " (2nd round)" : "";
    const allDone=e.logged.every(Boolean);
    h+=`<div class="card ${allDone?"done":""}" data-i="${i}">
      <div class="row between"><span class="ex-name">${i+1}. ${c.name}${dup}</span></div>
      <div style="margin-top:4px">${c.posture?'<span class="tag posture">posture</span>':""}${c.tags.map(x=>`<span class="tag">${x}</span>`).join("")}</div>
      <div class="goal"><b>${SETS} × ${c.min}–${c.max}</b> · <span class="${t.kind==="up"?"up":t.kind==="down"?"down":t.kind==="warn"?"warn":""}">${t.note}</span>
        <div class="small muted">${lastText(e.id)}</div></div>
      <div class="row between">
        <span class="small muted">Weight</span>
        <div class="stepper">
          <button data-act="w-" data-i="${i}">−</button>
          <input type="number" inputmode="decimal" data-act="w" data-i="${i}" value="${e.weight??""}" placeholder="lb">
          <button data-act="w+" data-i="${i}">+</button>
        </div>
      </div>
      <div class="sets">${e.reps.map((r,s)=>`
        <div class="set ${e.logged[s]?"logged":""}">
          <span class="lbl">Set ${s+1}</span>
          <div class="reps"><button data-act="r-" data-i="${i}" data-s="${s}">−</button><span>${r}</span><button data-act="r+" data-i="${i}" data-s="${s}">+</button></div>
          <button class="tick ${e.logged[s]?"on":""}" data-act="log" data-i="${i}" data-s="${s}">${e.logged[s]?"✓ done":"✓"}</button>
        </div>`).join("")}</div>
      <details><summary>Form cue</summary><div class="cue">${c.cue}</div></details>
    </div>`;
  });
  h+=`<button class="primary" id="finish">Finish & save workout</button>
      <p class="small muted" style="text-align:center">Only sets marked ✓ are saved. Unlogged exercises are skipped.</p>`;
  V.innerHTML=h;
}

function renderHistory(){
  if (!S.history.length){ V.innerHTML=`<div class="card muted">No workouts saved yet.</div>`+postureCard(); return; }
  let h=`<h2 style="margin-top:0">Progress</h2><div class="card"><table><tr><th>Exercise</th><th>First</th><th>Now</th></tr>`;
  Object.keys(EXERCISES).forEach(id=>{
    const p=entriesFor(id); if(!p.length) return;
    const f=p[p.length-1], l=p[0];
    const vol=x=>x.weight*x.reps.reduce((a,b)=>a+b,0);
    h+=`<tr><td>${cfg(id).name}</td><td>${f.weight}×${Math.max(...f.reps)}</td><td class="${vol(l)>vol(f)?"up":""}">${l.weight}×${Math.max(...l.reps)}</td></tr>`;
  });
  h+=`</table></div><h2>Sessions</h2>`;
  [...S.history].reverse().forEach((s,ri)=>{
    const idx=S.history.length-1-ri;
    h+=`<div class="card"><div class="row between"><b>Workout ${s.workout} · ${fmtDate(s.date)}</b>
        <button class="ghost small" data-act="del" data-i="${idx}">Delete</button></div>
        <table>${s.entries.map(e=>`<tr><td>${cfg(e.id).name}</td><td>${e.weight} lb</td><td>${e.reps.join(" / ")}</td></tr>`).join("")}</table></div>`;
  });
  V.innerHTML=h;
}

function postureCard(){
  return `<div class="card"><b>Posture extras (5 min, any day)</b><ul class="tips small">
    <li>Doorway chest stretch — 2 × 30 s each side. Tight pecs pull shoulders forward.</li>
    <li>Chin tucks — 2 × 10, hold 3 s. Counters forward head.</li>
    <li>Hip flexor stretch (half-kneel, squeeze glute) — 2 × 30 s each side.</li>
    <li>Rule of thumb kept in this program: about 2 pulling sets for every pushing set.</li></ul></div>`;
}

function renderSettings(){
  let h=`<h2 style="margin-top:0">Plan</h2>
  <div class="card small"><b>How progression works</b><ul class="tips">
    <li>Stay at a weight until you hit the top of the rep range on all 3 sets.</li>
    <li>Then the app adds one increment and drops you to the bottom of the range.</li>
    <li>Last 1–2 reps of each set should be hard, but with clean form.</li>
    <li>Alternate A and B with at least a day between. Two or three sessions per week.</li></ul></div>
  ${postureCard()}
  <h2>Machines</h2><div class="card"><p class="small muted" style="margin-top:0">Start weight is used only until the first logged session. Increment = the smallest jump on that machine's stack.</p>
  <div class="settings-grid"><span class="muted">Exercise</span><span class="muted">Start lb</span><span class="muted">+lb</span>`;
  Object.keys(EXERCISES).forEach(id=>{
    const c=cfg(id);
    h+=`<span>${c.name}</span><input type="number" inputmode="decimal" data-cfg="start" data-id="${id}" value="${c.start??""}">
        <input type="number" inputmode="decimal" data-cfg="inc" data-id="${id}" value="${c.inc}">`;
  });
  h+=`</div></div>
  <h2>Backup</h2><div class="card">
    <p class="small muted" style="margin-top:0">Data lives only in this browser. Export now and then.</p>
    <div class="row"><button id="exp" style="flex:1">Export</button><button id="imp" style="flex:1">Import</button><button id="rst" style="flex:1" class="ghost">Reset all</button></div>
    <textarea id="io" rows="4" style="width:100%;margin-top:8px" placeholder="Exported data appears here; paste data here to import."></textarea>
  </div>`;
  V.innerHTML=h;
}

/* ---------- Events ---------- */
document.querySelector(".tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-view]"); if(b) show(b.dataset.view); });

V.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const a=b.dataset.act, i=+b.dataset.i, s=+b.dataset.s;
  if (b.id==="finish") return finish();
  if (b.id==="exp"){ const t=document.getElementById("io"); t.value=JSON.stringify({history:S.history,cfg:S.cfg}); t.select(); try{navigator.clipboard.writeText(t.value);}catch(_){} return; }
  if (b.id==="imp"){ try{ const d=JSON.parse(document.getElementById("io").value); if(!Array.isArray(d.history)) throw 0;
      S.history=d.history; S.cfg=d.cfg||{}; S.draft=null; save(); alert("Imported "+d.history.length+" sessions."); show(nextWorkout()); }
    catch(_){ alert("That does not look like exported Gym Log data."); } return; }
  if (b.id==="rst"){ if(confirm("Delete all history and settings?")){ S={history:[],draft:null,cfg:{}}; save(); show("A"); } return; }
  if (a==="del"){ if(confirm("Delete this session?")){ S.history.splice(i,1); save(); renderHistory(); } return; }
  if (!S.draft) return;
  const en=S.draft.entries[i], c=en&&cfg(en.id);
  if (a==="w+"||a==="w-"){ en.weight=Math.max(0,(+en.weight||0)+(a==="w+"?c.inc:-c.inc)); }
  else if (a==="r+"){ en.reps[s]++; }
  else if (a==="r-"){ en.reps[s]=Math.max(0,en.reps[s]-1); }
  else if (a==="log"){ en.logged[s]=!en.logged[s]; if(en.logged[s]) startRest(c.min>=12?60:90); }
  else return;
  save(); const y=scrollY; renderWorkout(S.draft.workout); scrollTo(0,y);
});
V.addEventListener("change",e=>{
  const t=e.target;
  if (t.dataset.act==="w"){ S.draft.entries[+t.dataset.i].weight = t.value===""?null:+t.value; save(); }
  if (t.dataset.cfg){ const id=t.dataset.id; S.cfg[id]=S.cfg[id]||{}; S.cfg[id][t.dataset.cfg]= t.value===""?null:+t.value; save(); }
});

function finish(){
  const d=S.draft;
  const entries=d.entries.map(e=>({id:e.id, weight:+e.weight||0, reps:e.reps.filter((_,s)=>e.logged[s])}))
                          .filter(e=>e.reps.length);
  if (!entries.length){ alert("No sets are marked ✓ yet."); return; }
  if (d.entries.some(e=>e.logged.some(Boolean) && !(+e.weight)) && !confirm("Some logged exercises have no weight. Save anyway?")) return;
  // Merge duplicate exercises in one session (e.g. Seated Row twice in B): keep the heavier/better one for progression.
  const merged={}; entries.forEach(e=>{ const m=merged[e.id];
    if(!m || e.weight>m.weight || (e.weight===m.weight && Math.min(...e.reps)>Math.min(...m.reps))) merged[e.id]=e; });
  S.history.push({date:new Date().toISOString(), workout:d.workout, entries:Object.values(merged)});
  S.draft=null; save(); stopRest();
  alert("Saved. Next time: Workout "+nextWorkout()+".");
  show("history");
}

/* ---------- Rest timer ---------- */
let tEnd=0, tId=null;
const tDisp=document.getElementById("tDisp");
function startRest(sec){ tEnd=Date.now()+sec*1000; clearInterval(tId); tick(); tId=setInterval(tick,250); }
function stopRest(){ clearInterval(tId); tId=null; tDisp.textContent="0:00"; tDisp.className="t"; }
function tick(){
  const left=Math.max(0,Math.ceil((tEnd-Date.now())/1000));
  tDisp.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  tDisp.className="t"+(left===0?" up":"");
  if(left===0){ clearInterval(tId); tId=null; try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(_){} }
}
document.querySelector(".timer").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if (b.dataset.rest) startRest(+b.dataset.rest); else stopRest();
});

show(S.draft ? S.draft.workout : nextWorkout());
</script>
</body>
</html>
